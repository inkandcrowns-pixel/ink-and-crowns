name: last30days test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q yt-dlp
      - run: git clone --depth 1 https://github.com/mvanhorn/last30days-skill.git l30
      - name: Topic research (Roman Empire history)
        env:
          LAST30DAYS_ALLOW_ENGINE_PLAN: '1'
          FROM_BROWSER: 'off'
          BROWSER_CONSENT: 'false'
        run: |
          cd l30
          time python skills/last30days/scripts/last30days.py "Roman Empire history" --emit=json --output ../topic.json 2> ../topic_err.txt || true
          grep -E "YouTube|Reddit|HN|Blocked|Research complete" ../topic_err.txt | head -30
          python -c "import json;print(json.load(open('../topic.json'))['source_status'])" || true
      - uses: actions/upload-artifact@v4
        with:
          name: l30
          path: |
            topic.json
            topic_err.txt
