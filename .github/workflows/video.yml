name: Ink & Crowns video

on:
  schedule:
    - cron: '15 1 * * *'    # 06:45 IST: new day's free AI quota → script/voice/images
    - cron: '15 13 * * *'   # 18:45 IST: second pass (more images, render, queue to Drive)
    - cron: '0 18 * * *'    # 23:30 IST: publish job (Mon/Wed/Fri) + Drive cleanup (daily)
    - cron: '30 12 * * *'   # 18:00 IST: Shorts on days without a long video (9 AM + 6 PM US Eastern)
  workflow_dispatch:
    inputs:
      topic:
        description: 'Own topic for a NEW video (empty = trend research picks one)'
        required: false
      dry:
        description: 'Dry run (make everything, do not queue/upload)'
        type: boolean
        default: true
      mode:
        description: 'make = build next video into the Drive queue; publish = upload the oldest queued video now'
        type: choice
        options: [make, publish, shorts]
        default: make

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # one maker at a time; publishing has its own lane so it never waits behind a long render
    concurrency: { group: make, cancel-in-progress: false }
    # schedule runs only when the repo variable AUTO_POST is "on" (pause switch)
    if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'make') || (github.event_name == 'schedule' && (github.event.schedule == '15 1 * * *' || github.event.schedule == '15 13 * * *') && vars.AUTO_POST == 'on')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q pillow numpy faster-whisper
          ffmpeg -version | head -1
      - name: Whisper model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-en
      - name: Restore work in progress
        uses: actions/cache/restore@v4
        with:
          path: runs
          key: runs-${{ github.run_id }}
          restore-keys: runs-
      - name: Secrets
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s\n' "$ENV_FILE" | tr -d '\r' > .env
      - name: Pipeline
        env:
          TOPIC: ${{ inputs.topic }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry }}
        run: |
          set -- run
          [ "$DRY" = "true" ] && set -- "$@" --dry
          [ -n "$TOPIC" ] && set -- "$@" --topic "$TOPIC"
          node scripts/pipeline.js "$@"
      - name: Save work in progress
        if: always()
        uses: actions/cache/save@v4
        with:
          path: runs
          key: runs-${{ github.run_id }}
      - name: Keep the finished video (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: |
            runs/*/final.mp4
            runs/*/thumb.jpg
            runs/*/script.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit state
        if: always()
        run: |
          bash scripts/commit_state.sh "state: video run ${{ github.run_id }}"

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency: { group: publish, cancel-in-progress: false }
    if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish') || (github.event_name == 'schedule' && github.event.schedule == '0 18 * * *' && vars.AUTO_POST == 'on')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Publish oldest queued video + Drive cleanup
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        run: |
          printf '%s\n' "$ENV_FILE" | tr -d '\r' > .env
          node scripts/publish.js $FORCE
      - name: Commit state
        if: always()
        run: |
          bash scripts/commit_state.sh "state: publish run ${{ github.run_id }}"

  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency: { group: shorts, cancel-in-progress: false }
    if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'shorts') || (github.event_name == 'schedule' && github.event.schedule == '30 12 * * *' && vars.AUTO_POST == 'on')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Post 2 Shorts of the latest long video (morning + evening US)
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        run: |
          printf '%s\n' "$ENV_FILE" | tr -d '\r' > .env
          node scripts/publish_shorts.js $FORCE
          rm -f .env

  tune:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '15 1 * * *' && vars.AUTO_POST == 'on'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Weekly analysis (Sundays)
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ "$(date -u +%u)" != "7" ]; then echo "not Sunday"; exit 0; fi
          printf '%s\n' "$ENV_FILE" | tr -d '\r' > .env
          node scripts/tune.js
          bash scripts/commit_state.sh "state: weekly analysis"
